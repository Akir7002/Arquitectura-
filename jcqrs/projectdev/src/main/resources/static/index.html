<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCQRS | Panel de ventas</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="topbar">
        <div>
            <p class="eyebrow">JCQRS DEMO</p>
            <h1>Panel de ventas</h1>
            <p class="subtitle">Clientes, productos y pedidos en un flujo CQRS.</p>
        </div>
        <a class="button secondary" href="/swagger-ui.html" target="_blank" rel="noreferrer">Abrir Swagger</a>
    </header>

    <main class="container">
        <section id="message" class="message" hidden></section>
        <section class="summary-grid">
            <article class="summary-card"><span>Clientes</span><strong id="client-count">-</strong></article>
            <article class="summary-card"><span>Productos activos</span><strong id="product-count">-</strong></article>
            <article class="summary-card"><span>Pedidos</span><strong id="order-count">-</strong></article>
        </section>

        <section class="content-grid">
            <article class="panel">
                <div class="panel-heading">
                    <div><p class="eyebrow">CATALOGO</p><h2>Productos</h2></div>
                    <button class="button" id="open-product-form">Nuevo producto</button>
                </div>
                <div id="product-form" class="form-area" hidden>
                    <form id="product-create-form">
                        <input name="sku" placeholder="SKU" required>
                        <input name="nombre" placeholder="Nombre del producto" required>
                        <input name="precio" type="number" min="0.01" step="0.01" placeholder="Precio" required>
                        <button class="button" type="submit">Guardar producto</button>
                    </form>
                </div>
                <div id="products" class="table-wrap"></div>
            </article>

            <article class="panel">
                <div class="panel-heading">
                    <div><p class="eyebrow">VENTAS</p><h2>Nuevo pedido</h2></div>
                </div>
                <form id="order-form" class="order-form">
                    <label>Cliente
                        <select name="clienteId" id="client-select" required></select>
                    </label>
                    <label>Producto
                        <select name="productoId" id="product-select" required></select>
                    </label>
                    <label>Cantidad
                        <input name="cantidad" type="number" min="1" value="1" required>
                    </label>
                    <button class="button" type="submit">Crear pedido</button>
                </form>
                <div id="orders" class="orders"></div>
            </article>
        </section>
    </main>
    <script src="/app.js"></script>
</body>
</html>
